<!DOCTYPE html>
<html lang="en" data-app="matdesign" >
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#d6336c" />
    <title>Studio sign-in · MatDesign</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/ui/matui.boot.js?v=d2126bc2b9"></script>
    <link rel="stylesheet" href="/ui/matui.css?v=d2126bc2b9" />

<body>
    <a class="mat-skip" href="#main">Skip to the content</a>
    <!-- sprite -->

    <main class="mat-auth" id="main">
        
<div class="mat-auth__card">
    <div class="mat-auth__brand">
        <span class="mat-logo mat-logo--lg" data-app="matdesign" role="img" aria-label="MatDesign"><svg class="mat-icon" aria-hidden="true" focusable="false"><use href="#mat-i-palette"></use></svg></span>
        <h1>Studio</h1>
        <p class="mat-muted">Maintain and create what MatDesign shows.</p>
    </div>

        <div class="mat-alert mat-alert--warning"><svg class="mat-icon" aria-hidden="true" focusable="false"><use href="#mat-i-alert"></use></svg><div class="mat-alert__body"><strong>The Studio is off.</strong> No data directory is set. Set MATDESIGN_DATA to a directory that can be written (the image sets /data).</div></div>
        <div class="mat-btn-row mat-btn-row--plain">
            <a class="mat-btn mat-btn--secondary mat-btn--block" href="/"><svg class="mat-icon" aria-hidden="true" focusable="false"><use href="#mat-i-back"></use></svg><span>Back to the site</span></a>
        </div>
</div>

    </main>
    <script src="/ui/matui.js?v=d2126bc2b9"></script>
