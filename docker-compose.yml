# MatDesign - start it with:  docker compose up -d
# Then open http://localhost:8060. On the first visit the Studio asks you to create the administrator.
services:
  matdesign:
    image: ghcr.io/real-ttx/matdesign:latest
    container_name: matdesign
    restart: unless-stopped
    ports:
      - "8060:8060"
    volumes:
      - matdesign-data:/data

volumes:
  matdesign-data:
